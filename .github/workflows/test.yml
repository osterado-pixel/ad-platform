name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # ручной запуск из вкладки Actions

permissions:
  contents: read

# Новый push в ту же ветку отменяет устаревший прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend  # requirements.txt, тесты и код — в backend/

# Задачи идут ПО ОЧЕРЕДИ (needs): checks → e2e → docker → publish. Аккаунту GitHub
# выделяется мало параллельных серверов — при 7 одновременных задачах лишние 15 минут ждали
# в очереди и отменялись («The job was not acquired by Runner ... after multiple attempts»).
jobs:
  checks:
    name: Тесты (SQLite и PostgreSQL) и миграции
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ad_platform_test
        ports:
          - 5432:5432
        # Ждём готовности базы данных
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Не короче 32 символов — иначе приложение не запустится
      SECRET_KEY: ci-test-secret-key-0123456789abcdefghijklmnop
      PG_URL: postgresql+psycopg2://postgres:testpassword@localhost:5432/ad_platform_test

    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # как в Docker-образе
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Миграции — первыми, на пустой базе: накат, сверка с моделями, откат
      - name: Миграции на PostgreSQL — накат всех
        run: DATABASE_URL="$PG_URL" alembic upgrade head
      - name: Модели совпадают со схемой (нет забытой миграции)
        run: DATABASE_URL="$PG_URL" alembic check
      - name: Откат и повторный накат, затем снова пустая база для тестов
        run: |
          DATABASE_URL="$PG_URL" alembic downgrade base
          DATABASE_URL="$PG_URL" alembic upgrade head
          DATABASE_URL="$PG_URL" alembic downgrade base

      # Тесты никогда не трогают DATABASE_URL (рабочую базу): SQLite в памяти,
      # а для PostgreSQL — TEST_DATABASE_URL
      - name: Тесты на SQLite (с покрытием кода)
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Тесты на PostgreSQL
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: python -m pytest -q

  e2e:
    name: Браузерные тесты (Chromium)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Установка Chromium
        run: python -m playwright install --with-deps chromium
      - name: Сквозные тесты в браузере
        env:
          SECRET_KEY: ci-test-secret-key-0123456789abcdefghijklmnop
        run: python -m pytest -m e2e -v
      - name: Скриншоты при сбое
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/adp_e2e_failures/
          if-no-files-found: ignore

  docker:
    name: Сборка Docker-образа
    needs: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v4

      - name: Конфигурация docker compose корректна
        run: |
          docker compose config --quiet
          docker compose -f backend/docker-compose.yml config --quiet
          DOMAIN=ads.example.com ACME_EMAIL=ci@example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Проверка сборки Docker-образа
        uses: docker/build-push-action@v5
        with:
          context: backend            # Dockerfile и код — в backend/
          file: backend/Dockerfile
          push: false
          load: true                  # образ нужен следующему шагу
          tags: ad-platform-api:test
          cache-from: type=gha        # кеш слоёв: повторная сборка — секунды
          cache-to: type=gha,mode=max

      - name: Собранный образ запускается и отвечает
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SECRET_KEY=ci-test-secret-key-0123456789abcdefghijklmnop \
            -e DATABASE_URL=sqlite:////app/data/app.db \
            ad-platform-api:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  # --- ПУБЛИКАЦИЯ В GITHUB CONTAINER REGISTRY (ghcr.io) ---
  # Только при push в main и только если прошли ВСЕ проверки: в реестр не попадёт образ,
  # у которого упали тесты, миграции или браузерные тесты
  publish:
    name: Публикация образа в GHCR
    needs: [ checks, e2e, docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Право писать в реестр — только этой задаче, а не всему workflow
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Извлечение метаданных для Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # имя приводится к нижнему регистру автоматически
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Сборка и push Docker-образа
        uses: docker/build-push-action@v5
        with:
          context: backend            # Dockerfile и код — в backend/
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # слои уже собраны задачей docker — сборка займёт секунды
          cache-to: type=gha,mode=max
