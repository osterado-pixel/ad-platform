name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # ручной запуск из вкладки Actions

permissions:
  contents: read

# Новый push в ту же ветку отменяет устаревший прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend  # requirements.txt, тесты и код — в backend/

jobs:
  test:
    name: Тесты (Python ${{ matrix.python }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.13", "3.14" ]   # 3.14 — как в Docker-образе
        db: [ sqlite, postgres ]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ad_platform_test
        ports:
          - 5432:5432
        # Ждём готовности базы данных
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Запуск тестов и проверка покрытия
        env:
          # Не короче 32 символов — иначе приложение не запустится
          SECRET_KEY: ci-test-secret-key-0123456789abcdefghijklmnop
          # Тесты никогда не трогают DATABASE_URL (рабочую базу) — для прогона на PostgreSQL
          # служит TEST_DATABASE_URL; пусто — SQLite в памяти
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg2://postgres:testpassword@localhost:5432/ad_platform_test' || '' }}
        run: python -m pytest --cov=app --cov-report=term-missing

  migrations:
    name: Миграции на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ad_platform_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:testpassword@localhost:5432/ad_platform_migrations
      SECRET_KEY: ci-test-secret-key-0123456789abcdefghijklmnop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Накат всех миграций
        run: alembic upgrade head
      - name: Модели совпадают со схемой (нет забытой миграции)
        run: alembic check
      - name: Откат и повторный накат
        run: |
          alembic downgrade base
          alembic upgrade head

  e2e:
    name: Браузерные тесты (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Установка Chromium
        run: python -m playwright install --with-deps chromium
      - name: Сквозные тесты в браузере
        env:
          SECRET_KEY: ci-test-secret-key-0123456789abcdefghijklmnop
        run: python -m pytest -m e2e -v
      - name: Скриншоты при сбое
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/adp_e2e_failures/
          if-no-files-found: ignore

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Конфигурация docker compose корректна
        run: |
          docker compose config --quiet
          docker compose -f backend/docker-compose.yml config --quiet
          DOMAIN=ads.example.com ACME_EMAIL=ci@example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Сборка образа
        run: docker build -t ad-platform-api:ci backend
