name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # ручной запуск из вкладки Actions

permissions:
  contents: read

# Новый push в ту же ветку отменяет устаревший прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Всё — ОДНОЙ задачей, шагами по порядку. GitHub выдаёт этому аккаунту сервер только для
# первой задачи прогона: остальные 15 минут ждали в очереди и отменялись («The job was not
# acquired by Runner of type hosted even after multiple attempts»). Любой упавший шаг
# останавливает задачу — до публикации образа дело не дойдёт.
jobs:
  ci:
    name: Тесты, браузер, сайт, бот, Docker, публикация
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write   # для публикации в GHCR (шаги публикации — только при push в main)

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ad_platform_test
        ports:
          - 5432:5432
        # Ждём готовности базы данных
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Не короче 32 символов — иначе приложение не запустится
      SECRET_KEY: ci-test-secret-key-0123456789abcdefghijklmnop
      PG_URL: postgresql+psycopg2://postgres:testpassword@localhost:5432/ad_platform_test
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    defaults:
      run:
        working-directory: backend  # requirements.txt, тесты и код — в backend/

    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # как в Docker-образе
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --- 1. Миграции на пустой базе PostgreSQL: накат, сверка с моделями, откат ---
      - name: Миграции на PostgreSQL — накат всех
        run: DATABASE_URL="$PG_URL" alembic upgrade head
      - name: Модели совпадают со схемой (нет забытой миграции)
        run: DATABASE_URL="$PG_URL" alembic check
      - name: Откат и повторный накат, затем снова пустая база для тестов
        run: |
          DATABASE_URL="$PG_URL" alembic downgrade base
          DATABASE_URL="$PG_URL" alembic upgrade head
          DATABASE_URL="$PG_URL" alembic downgrade base

      # --- 2. Тесты. DATABASE_URL (рабочую базу) тесты никогда не трогают:
      #        SQLite в памяти, а для PostgreSQL — TEST_DATABASE_URL ---
      - name: Тесты на SQLite (с покрытием кода)
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Тесты на PostgreSQL
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: python -m pytest -q

      # --- 3. Браузерные тесты ---
      - name: Установка Chromium
        run: python -m playwright install --with-deps chromium
      - name: Сквозные тесты в браузере
        run: python -m pytest -m e2e -v --no-cov  # проверяют интерфейс, а не покрытие (порог 80% — для обычных тестов)
      - name: Скриншоты при сбое браузерных тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/adp_e2e_failures/
          if-no-files-found: ignore

      # --- Telegram-бот: тесты (отдельное окружение — свои зависимости) ---
      - name: Тесты Telegram-бота
        working-directory: bot
        run: |
          python -m venv /tmp/botvenv
          /tmp/botvenv/bin/pip install -q -r requirements-dev.txt
          /tmp/botvenv/bin/python -m pytest -q

      # --- Сайт (Next.js): зависимости, проверка кода, сборка ---
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"            # как в frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Сайт — зависимости, переводы, ESLint, сборка
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run check:i18n   # во всех языках — все переводы и подстановки
          npm run lint
          npm run build

      # --- 4. Docker: конфигурации, сборка, запуск собранного образа ---
      - name: Конфигурация docker compose корректна
        working-directory: .
        run: |
          docker compose config --quiet
          docker compose -f backend/docker-compose.yml config --quiet
          DOMAIN=ads.example.com ACME_EMAIL=ci@example.com \
            docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          DOMAIN=ads.example.com ACME_EMAIL=ci@example.com             docker compose -f docker-compose.prod.yml -f docker-compose.https.yml config --quiet

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Проверка сборки Docker-образа
        uses: docker/build-push-action@v5
        with:
          context: backend            # Dockerfile и код — в backend/
          file: backend/Dockerfile
          push: false
          load: true                  # образ нужен следующему шагу
          tags: ad-platform-api:test
          cache-from: type=gha,scope=api   # кеш слоёв: повторная сборка — секунды
          cache-to: type=gha,mode=max,scope=api

      - name: Проверка сборки образа сайта
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: ad-platform-frontend:test
          build-args: BACKEND_URL=http://api:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Проверка сборки образа бота
        uses: docker/build-push-action@v5
        with:
          context: bot
          file: bot/Dockerfile
          push: false
          load: true
          tags: ad-platform-bot:test
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - name: Собранный образ запускается и отвечает
        working-directory: .
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SECRET_KEY="$SECRET_KEY" \
            -e DATABASE_URL=sqlite:////app/data/app.db \
            ad-platform-api:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

      - name: Образ сайта запускается и передаёт запросы API
        working-directory: .
        run: |
          docker run -d --name frontend -p 3000:3000 --add-host api:host-gateway ad-platform-frontend:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null && curl -fsS http://127.0.0.1:3000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs frontend
          exit 1

      - name: Образ бота запускается (без токена — понятная ошибка, а не падение)
        working-directory: .
        run: |
          docker run --rm --entrypoint python ad-platform-bot:test -c "import main"
          out=$(docker run --rm ad-platform-bot:test 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "BOT_TOKEN"

      # --- 5. ПУБЛИКАЦИЯ В GITHUB CONTAINER REGISTRY (ghcr.io) ---
      # Только при push в main; до этих шагов дойдёт лишь при успехе всех проверок выше
      - name: Авторизация в GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Извлечение метаданных для Docker
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # имя приводится к нижнему регистру автоматически
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Сборка и push Docker-образа
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api   # слои уже собраны выше — займёт секунды

      - name: Метаданные образа сайта
        if: env.PUBLISH == 'true'
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Сборка и push образа сайта
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: BACKEND_URL=http://api:8000
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend

      - name: Метаданные образа бота
        if: env.PUBLISH == 'true'
        id: meta_bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-bot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Сборка и push образа бота
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v5
        with:
          context: bot
          file: bot/Dockerfile
          push: true
          tags: ${{ steps.meta_bot.outputs.tags }}
          labels: ${{ steps.meta_bot.outputs.labels }}
          cache-from: type=gha,scope=bot
