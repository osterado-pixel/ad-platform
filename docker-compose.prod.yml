# Боевой запуск ГОТОВОГО образа из реестра (ghcr.io) — исходный код не нужен и не собирается.
# Образ публикует CI после каждого успешного push в main.
#
#   docker compose -f docker-compose.prod.yml pull     # скачать свежий образ
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec api python -m app.cli create-admin admin@example.com
#
# С доменом и HTTPS (Caddy, Let's Encrypt) — добавьте надстройку:
#   docker compose -f docker-compose.prod.yml -f docker-compose.https.yml up -d
#
# Значения — из .env рядом с этим файлом; если его нет, запуск не падает (значения по умолчанию).

# Отдельное имя проекта: не пересекается с docker-compose.yml (сборка из исходников)
name: ad-platform-prod

# Общие настройки приложения: api и celery_worker должны работать с одинаковыми базой, ключами,
# ценами и курсом — иначе воркер считал бы деньги не так, как api
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword123}@db:5432/${POSTGRES_DB:-ad_platform_db}
  # Не задан — приложение генерирует случайный ключ и хранит его в томе prod_app_data.
  # НЕ известный всем ключ из примеров: с ним подделали бы вход под администратором
  SECRET_KEY: ${SECRET_KEY:-}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  WEB_WORKERS: ${WEB_WORKERS:-2}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  CLICK_DEDUP_MINUTES: ${CLICK_DEDUP_MINUTES:-10}
  PUBLISHER_REVENUE_SHARE: ${PUBLISHER_REVENUE_SHARE:-0.60}
  EARNINGS_HOLD_DAYS: ${EARNINGS_HOLD_DAYS:-14}
  PAYOUT_MIN_AMOUNT: ${PAYOUT_MIN_AMOUNT:-20}
  PARTNER_DEFAULT_CPC: ${PARTNER_DEFAULT_CPC:-0.10}
  REFERRAL_SHARE: ${REFERRAL_SHARE:-0.10}
  REFERRAL_DAYS: ${REFERRAL_DAYS:-365}
  AUCTION_EXPLORE_RATE: ${AUCTION_EXPLORE_RATE:-0.1}
  SITE_AUTO_CHECK: ${SITE_AUTO_CHECK:-true}
  FRAUD_AUTO_BLOCK: ${FRAUD_AUTO_BLOCK:-true}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
  AUTO_PURGE: ${AUTO_PURGE:-true}
  CLICKS_RETENTION_DAYS: ${CLICKS_RETENTION_DAYS:-30}
  AI_TASKS_RETENTION_DAYS: ${AI_TASKS_RETENTION_DAYS:-90}
  LOGIN_MAX_FAILURES_PER_EMAIL: ${LOGIN_MAX_FAILURES_PER_EMAIL:-5}
  LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-20}
  LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
  REGISTER_MAX_PER_IP_PER_HOUR: ${REGISTER_MAX_PER_IP_PER_HOUR:-10}
  # AI-проверка объявлений: без ключа выключена, модерация только вручную
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
  AI_AUTO_REJECT: ${AI_AUTO_REJECT:-true}
  AI_AUTO_APPROVE: ${AI_AUTO_APPROVE:-true}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
  GEMINI_PRICE_INPUT_PER_1M: ${GEMINI_PRICE_INPUT_PER_1M:-0.75}
  GEMINI_PRICE_OUTPUT_PER_1M: ${GEMINI_PRICE_OUTPUT_PER_1M:-3.75}
  AI_MARKUP: ${AI_MARKUP:-1.5}
  AI_COPY_FALLBACK: ${AI_COPY_FALLBACK:-true}
  CLAUDE_COPY_MODEL: ${CLAUDE_COPY_MODEL:-claude-haiku-4-5}
  CLAUDE_PRICE_INPUT_PER_1M: ${CLAUDE_PRICE_INPUT_PER_1M:-1}
  CLAUDE_PRICE_OUTPUT_PER_1M: ${CLAUDE_PRICE_OUTPUT_PER_1M:-5}
  USD_RATE: ${USD_RATE:-1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_CLEANUP_INTERVAL_SECONDS: ${AI_CLEANUP_INTERVAL_SECONDS:-300}
  AI_TASK_TIMEOUT_MINUTES: ${AI_TASK_TIMEOUT_MINUTES:-10}
  SENTRY_DSN: ${SENTRY_DSN:-}
  # Telegram-бот: общий секрет бота и API (≥ 32 символов) и имя бота для ссылки привязки
  TELEGRAM_BOT_SECRET: ${TELEGRAM_BOT_SECRET:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  # Приём платежей: пусто — выключен (пополняет администратор); test — тестовый, деньги ненастоящие
  PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-}
  PAYMENTS_CURRENCY: ${PAYMENTS_CURRENCY:-RUB}
  PAYMENTS_MIN_AMOUNT: ${PAYMENTS_MIN_AMOUNT:-1}
  PAYMENTS_MAX_AMOUNT: ${PAYMENTS_MAX_AMOUNT:-100000}
  PAYMENTS_TEST_SECRET: ${PAYMENTS_TEST_SECRET:-}
  PUBLIC_URL: ${PUBLIC_URL:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  REDIS_URL: redis://:${REDIS_PASSWORD:-myredispassword123}@redis:6379/0

services:
  db:
    image: postgres:17-alpine
    container_name: prod_ad_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Порт базы наружу не открыт — к ней подключается только api из внутренней сети Docker.
      # Для сервера всё равно задайте свой пароль в .env: значение по умолчанию есть в README
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-ad_platform_db}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: prod_ad_platform_redis
    restart: unless-stopped
    # Порт наружу НЕ открыт (как и у базы): Redis без защиты в интернете — частая причина взлома
    # серверов. К нему подключается только api из внутренней сети Docker, и то с паролем
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-myredispassword123}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-myredispassword123}  # пароль для redis-cli (проверка здоровья)
    # appendonly: данные (очередь задач) переживают перезапуск контейнера
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    # IMAGE_TAG — точная версия для воспроизводимости (например sha-df56c40), по умолчанию latest
    image: ghcr.io/osterado-pixel/ad-platform:${IMAGE_TAG:-latest}
    container_name: prod_ad_platform_backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment: *app-env
    volumes:
      - prod_app_data:/app/data
    depends_on:
      db:
        # Ждём, пока PostgreSQL реально принимает подключения: иначе миграции при старте упадут
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    # Тот же образ, что у api (та же версия кода), но вместо веб-сервера — обработчик очереди
    image: ghcr.io/osterado-pixel/ad-platform:${IMAGE_TAG:-latest}
    container_name: prod_ad_platform_celery
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    environment: *app-env
    volumes:
      - prod_app_data:/app/data  # тот же сгенерированный SECRET_KEY, что у api
    # Проверка образа обращается к веб-серверу, которого у воркера нет — своя проверка: воркер отвечает
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      # api при старте применяет миграции: воркер начинает работу с базой только после них
      api:
        condition: service_healthy

  frontend:
    # Сайт (Next.js) — образ публикует CI вместе с образом api, той же версии (IMAGE_TAG)
    image: ghcr.io/osterado-pixel/ad-platform-frontend:${IMAGE_TAG:-latest}
    container_name: prod_ad_platform_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  bot:
    # Telegram-бот (образ той же версии). Профиль bot: только когда есть токен от @BotFather:
    #   docker compose -f docker-compose.prod.yml --profile bot up -d
    image: ghcr.io/osterado-pixel/ad-platform-bot:${IMAGE_TAG:-latest}
    container_name: prod_ad_platform_bot
    profiles: ["bot"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_BOT_SECRET: ${TELEGRAM_BOT_SECRET:-}
      API_URL: http://api:8000
      SITE_URL: ${SITE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prod_postgres_data:
  prod_app_data:
  prod_redis_data:
