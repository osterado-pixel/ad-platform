# Запуск в Docker: приложение + PostgreSQL. Значения — из backend/.env (см. .env.example).
#
#   cd backend
#   docker compose up -d --build
#   docker compose exec web python -m app.cli create-admin admin@example.com
#
# Боевой сервер с доменом и HTTPS — docker-compose.yml в корне проекта (см. README).

services:
  db:
    image: postgres:17-alpine
    container_name: ad_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Без значения по умолчанию: пароль из примера подбирается первым
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ad_platform_db}
    ports:
      # Только с этого компьютера (pgAdmin, DBeaver, psql): 127.0.0.1, а не все адреса —
      # иначе база доступна из сети. 5433, а не 5432: 5432 часто занят локальным PostgreSQL
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: ad_platform_backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Внутри Docker база доступна по имени сервиса db и порту 5432
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в backend/.env}@db:5432/${POSTGRES_DB:-ad_platform_db}
      # Без значения по умолчанию: известный всем ключ позволяет подделать вход под любым пользователем
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в backend/.env}
      WEB_WORKERS: ${WEB_WORKERS:-2}
    depends_on:
      db:
        # Ждём, пока PostgreSQL реально принимает подключения: иначе миграции при старте упадут
        condition: service_healthy

volumes:
  postgres_data:
