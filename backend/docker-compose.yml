# Простой запуск одним контейнером на SQLite (без PostgreSQL).
# Для боевого сервера с PostgreSQL и HTTPS — docker-compose.yml в корне проекта (см. README).
#
#   cd backend
#   docker compose up -d --build
#   docker compose exec web python -m app.cli create-admin admin@example.com
#
# SECRET_KEY берётся из backend/.env (start.ps1 создаёт его сам) или из переменной окружения.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ad_platform_backend
    # Перезапуск после сбоя и перезагрузки сервера, но не после ручной остановки
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # База — внутри тома /app/data: переживает пересоздание контейнера и обновление образа
      DATABASE_URL: sqlite:////app/data/app.db
      # Ключ подписи токенов не хранится в этом файле (он попал бы в Git)
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в backend/.env или в переменной окружения}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # SQLite — один писатель: один процесс сервера (несколько — для PostgreSQL)
      WEB_WORKERS: 1
    volumes:
      # Именованный том Docker с базой SQLite
      - sqlite_data:/app/data
    # Проверка здоровья уже встроена в образ (HEALTHCHECK в Dockerfile, без curl)

volumes:
  sqlite_data:
