# Запуск в Docker: приложение + PostgreSQL. Значения — из backend/.env (см. .env.example);
# если .env потерялся, у всех переменных есть значения по умолчанию и запуск не падает.
#
#   cd backend
#   docker compose up -d --build
#   docker compose exec api python -m app.cli create-admin admin@example.com
#
# Боевой сервер с доменом и HTTPS — docker-compose.yml в корне проекта (см. README):
# там значения по умолчанию для паролей намеренно не заданы.

services:
  db:
    image: postgres:17-alpine
    container_name: ad_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Пароль по умолчанию — только для локального запуска: база доступна лишь с этого
      # компьютера (127.0.0.1) и из внутренней сети Docker. PostgreSQL запоминает пароль при
      # первом запуске: если позже поменять его в .env, базу придётся пересоздать
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-ad_platform_db}
    ports:
      # 127.0.0.1, а не все адреса — иначе база доступна из сети.
      # 5433, а не 5432: 5432 часто занят локальным PostgreSQL
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: ad_platform_backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword123}@db:5432/${POSTGRES_DB:-ad_platform_db}
      # Без SECRET_KEY приложение не падает и НЕ берёт известный всем ключ из примеров:
      # генерирует случайный и хранит его в томе app_data (переживает перезапуск)
      SECRET_KEY: ${SECRET_KEY:-}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      WEB_WORKERS: ${WEB_WORKERS:-2}
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        # Ждём, пока PostgreSQL реально принимает подключения: иначе миграции при старте упадут
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
