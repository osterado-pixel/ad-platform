[pytest]
testpaths = tests
markers =
    e2e: сквозные тесты в браузере (нужны Playwright и Edge/Chrome). Запуск: python -m pytest -m e2e
# Обычный прогон — без браузерных тестов (быстро и без зависимостей от браузера) и с покрытием:
# в терминале — только файлы с непокрытыми строками (номера строк), полный отчёт — htmlcov/index.html.
# Без покрытия (быстрее, например для одного теста): python -m pytest --no-cov tests/test_x.py
addopts =
    -m "not e2e"
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
# Любое предупреждение в тестах — ошибка (устаревшие API, незакрытые ресурсы и т.п.)
filterwarnings =
    error
    # google-genai на Python 3.14 при импорте задевает устаревший typing._UnionGenericAlias —
    # это внутри библиотеки, не в нашем коде; убрать после обновления google-genai
    ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning
