# Запуск из папки ad-platform:
#   docker compose up -d --build
# Первый администратор:
#   docker compose exec api python -m app.cli create-admin admin@example.com
#
# Значения — из .env рядом с этим файлом (см. .env.example). Если .env нет или в нём чего-то
# не хватает, у всех переменных есть значения по умолчанию — запуск не падает.
# Готовый образ из реестра вместо сборки — docker-compose.prod.yml; HTTPS — + docker-compose.https.yml.
services:
  db:
    image: postgres:17-alpine
    container_name: ad_platform_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Пароль по умолчанию допустим: порт базы наружу не открыт, к ней подключается только
      # приложение из внутренней сети Docker. PostgreSQL запоминает пароль при первом запуске:
      # если позже поменять его в .env, базу придётся пересоздать
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-ad_platform_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    container_name: ad_platform_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword123}@db:5432/${POSTGRES_DB:-ad_platform_db}
      # Без SECRET_KEY приложение не падает и НЕ берёт известный всем ключ из примеров
      # (API открыт в сеть — с таким ключом подделали бы вход): генерирует случайный ключ
      # и хранит его в томе app_data, он переживает перезапуск
      SECRET_KEY: ${SECRET_KEY:-}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # Пусто — сторонним фронтендам доступ закрыт (встроенный интерфейс /app работает и так)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      CLICK_DEDUP_MINUTES: ${CLICK_DEDUP_MINUTES:-10}
      PUBLISHER_REVENUE_SHARE: ${PUBLISHER_REVENUE_SHARE:-0.60}
      EARNINGS_HOLD_DAYS: ${EARNINGS_HOLD_DAYS:-14}
      PAYOUT_MIN_AMOUNT: ${PAYOUT_MIN_AMOUNT:-20}
      PARTNER_DEFAULT_CPC: ${PARTNER_DEFAULT_CPC:-0.10}
      REFERRAL_SHARE: ${REFERRAL_SHARE:-0.10}
      REFERRAL_DAYS: ${REFERRAL_DAYS:-365}
      AUCTION_EXPLORE_RATE: ${AUCTION_EXPLORE_RATE:-0.1}
      SITE_AUTO_CHECK: ${SITE_AUTO_CHECK:-true}
      FRAUD_AUTO_BLOCK: ${FRAUD_AUTO_BLOCK:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      AUTO_PURGE: ${AUTO_PURGE:-true}
      CLICKS_RETENTION_DAYS: ${CLICKS_RETENTION_DAYS:-30}
      AI_TASKS_RETENTION_DAYS: ${AI_TASKS_RETENTION_DAYS:-90}
      LOGIN_MAX_FAILURES_PER_EMAIL: ${LOGIN_MAX_FAILURES_PER_EMAIL:-5}
      LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-20}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      REGISTER_MAX_PER_IP_PER_HOUR: ${REGISTER_MAX_PER_IP_PER_HOUR:-10}
      # AI-проверка объявлений: без ключа выключена, модерация только вручную
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_AUTO_REJECT: ${AI_AUTO_REJECT:-true}
      AI_AUTO_APPROVE: ${AI_AUTO_APPROVE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_PRICE_INPUT_PER_1M: ${GEMINI_PRICE_INPUT_PER_1M:-0.75}
      GEMINI_PRICE_OUTPUT_PER_1M: ${GEMINI_PRICE_OUTPUT_PER_1M:-3.75}
      AI_MARKUP: ${AI_MARKUP:-1.5}
      AI_COPY_FALLBACK: ${AI_COPY_FALLBACK:-true}
      CLAUDE_COPY_MODEL: ${CLAUDE_COPY_MODEL:-claude-haiku-4-5}
      CLAUDE_PRICE_INPUT_PER_1M: ${CLAUDE_PRICE_INPUT_PER_1M:-1}
      CLAUDE_PRICE_OUTPUT_PER_1M: ${CLAUDE_PRICE_OUTPUT_PER_1M:-5}
      USD_RATE: ${USD_RATE:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_CLEANUP_INTERVAL_SECONDS: ${AI_CLEANUP_INTERVAL_SECONDS:-300}
      AI_TASK_TIMEOUT_MINUTES: ${AI_TASK_TIMEOUT_MINUTES:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Telegram-бот: общий секрет бота и API (≥ 32 символов) и имя бота для ссылки привязки
      TELEGRAM_BOT_SECRET: ${TELEGRAM_BOT_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Приём платежей: пусто — выключен (пополняет администратор); test — тестовый, деньги ненастоящие
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-}
      PAYMENTS_CURRENCY: ${PAYMENTS_CURRENCY:-RUB}
      PAYMENTS_MIN_AMOUNT: ${PAYMENTS_MIN_AMOUNT:-1}
      PAYMENTS_MAX_AMOUNT: ${PAYMENTS_MAX_AMOUNT:-100000}
      PAYMENTS_TEST_SECRET: ${PAYMENTS_TEST_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        # Ждём, пока PostgreSQL реально принимает подключения: иначе миграции при старте упадут
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # Сайт (Next.js): лендинг и AI-копирайтер. Кабинет /app и API — у сервиса api
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000  # куда сайт передаёт /api, /app и т.п. (вшивается при сборке)
    container_name: ad_platform_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  bot:
    # Telegram-бот. Профиль bot: запускается только явно, когда есть токен от @BotFather:
    #   docker compose --profile bot up -d --build
    build: ./bot
    container_name: ad_platform_bot
    profiles: ["bot"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_BOT_SECRET: ${TELEGRAM_BOT_SECRET:-}
      API_URL: http://api:8000
      SITE_URL: ${SITE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  app_data:
