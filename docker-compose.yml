# Запуск из папки ad-platform:
#   docker compose up -d --build
# Первый администратор:
#   docker compose exec api python -m app.cli create-admin admin@example.com
#
# Значения — из .env рядом с этим файлом (см. .env.example). Если .env нет или в нём чего-то
# не хватает, у всех переменных есть значения по умолчанию — запуск не падает.
# Готовый образ из реестра вместо сборки — docker-compose.prod.yml; HTTPS — + docker-compose.https.yml.
services:
  db:
    image: postgres:17-alpine
    container_name: ad_platform_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Пароль по умолчанию допустим: порт базы наружу не открыт, к ней подключается только
      # приложение из внутренней сети Docker. PostgreSQL запоминает пароль при первом запуске:
      # если позже поменять его в .env, базу придётся пересоздать
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-ad_platform_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    container_name: ad_platform_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword123}@db:5432/${POSTGRES_DB:-ad_platform_db}
      # Без SECRET_KEY приложение не падает и НЕ берёт известный всем ключ из примеров
      # (API открыт в сеть — с таким ключом подделали бы вход): генерирует случайный ключ
      # и хранит его в томе app_data, он переживает перезапуск
      SECRET_KEY: ${SECRET_KEY:-}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # Пусто — сторонним фронтендам доступ закрыт (встроенный интерфейс /app работает и так)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      CLICK_DEDUP_MINUTES: ${CLICK_DEDUP_MINUTES:-10}
      # AI-проверка объявлений: без ключа выключена, модерация только вручную
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_AUTO_REJECT: ${AI_AUTO_REJECT:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_PRICE_INPUT_PER_1M: ${GEMINI_PRICE_INPUT_PER_1M:-0.75}
      GEMINI_PRICE_OUTPUT_PER_1M: ${GEMINI_PRICE_OUTPUT_PER_1M:-3.75}
      AI_MARKUP: ${AI_MARKUP:-1.5}
      USD_RATE: ${USD_RATE:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_CLEANUP_INTERVAL_SECONDS: ${AI_CLEANUP_INTERVAL_SECONDS:-300}
      AI_TASK_TIMEOUT_MINUTES: ${AI_TASK_TIMEOUT_MINUTES:-10}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        # Ждём, пока PostgreSQL реально принимает подключения: иначе миграции при старте упадут
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  app_data:
