# Надстройка HTTPS (Caddy + Let's Encrypt) — накладывается на любой из вариантов:
#   готовый образ из реестра:  docker compose -f docker-compose.prod.yml -f docker-compose.https.yml up -d
#   сборка из исходников:      docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# В .env дополнительно: DOMAIN=ads.example.com и ACME_EMAIL=you@example.com
services:
  api:
    # Наружу API не публикуется — только через Caddy
    ports: !reset []
    environment:
      # X-Forwarded-For принимается от кого угодно — но API доступен только из внутренней
      # сети Docker, то есть только от Caddy. Подделать IP посетитель не может
      FORWARDED_ALLOW_IPS: "*"
      ALLOWED_HOSTS: ${DOMAIN:?Задайте DOMAIN в .env (например ads.example.com)}

  frontend:
    # Наружу сайт не публикуется — только через Caddy
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?Задайте ACME_EMAIL в .env — для писем Let's Encrypt о сертификате}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # сертификаты — не потерять при пересоздании контейнера
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
